name: ansible-lint
on:
  push:
    branches-ignore:
      - main
jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates

      - uses: actions/checkout@v6

      - name: Install Ansible and ansible-lint
        run: |
          python3 -m pip install --break-system-packages ansible-core ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        run: ansible-lint

  ansible-deploy-test:
    name: Run Ansible Deploy test
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Debian non-free repositories
        run: |
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Components: .*/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -i 's/ main$/ main contrib non-free non-free-firmware/g' /etc/apt/sources.list
          fi

      - name: create /etc/recoverybox directory
        run: |
          mkdir -p /etc/recoverybox
          chown root:root /etc/recoverybox
          chmod 0755 /etc/recoverybox

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-apt python3-debian git ca-certificates sudo systemd cron

      - name: Install Ansible and Python deps
        run: |
          python3 -m pip install --break-system-packages ansible-core docker

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook
        run: |
          ansible-playbook ansible/Install.yml \
            --inventory "localhost," \
            --connection local \
            --tags "dry_run" \
            --diff
