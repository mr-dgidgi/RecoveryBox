name: Deploy Wiki

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. get repo code
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. Install MkDocs and dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # 4. Build the MkDocs site using the correct config file
      # Change to the wiki directory before building
      - name: Build MkDocs site
        run: |
          cd ansible/roles/recoverybox/files/data/wiki
          mkdocs build

      # 5. Deploy the generated 'site' folder to website using SFTP
      - name: SFTP Deploy to website
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path to the generated 'site' folder within the Ansible role
          localDir: 'ansible/roles/recoverybox/files/data/wiki/site/'
          # Destination on your web server
          remoteDir: '/wiki/'
          delete: false