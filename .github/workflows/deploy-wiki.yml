name: Deploy Wiki

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs dependencies
        run: |
          pip install mkdocs mkdocs-material

      - name: Build wiki with MkDocs
        run: |
          mkdocs build -f wiki-sources/mkdocs.yml -d ansible/roles/recoverybox/files/data/www/wiki/

      - name: Upload via SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: 'ansible/roles/recoverybox/files/data/www/wiki/'
          remoteDir: 'www/wiki/'
          concurrency: 8
