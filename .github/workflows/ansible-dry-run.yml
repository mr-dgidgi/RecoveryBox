name: ansible-dry-run

on:
  push:
    branches: ["main", "Ansible-migration"]
  pull_request:
    branches: ["main", "Ansible-migration"]

jobs:
  dry-run:
    name: Run Ansible Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core docker

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook in check mode (dry-run tag)
        run: |
          ansible-playbook ansible/Install.yml \
            --inventory "localhost," \
            --connection local \
            --tags "dry_run" \
            --check \
            --diff
