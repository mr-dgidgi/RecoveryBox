name: ansible-dry-run

on:
  pull_request:
    branches:
      - main
      - Pre-Release

jobs:
  dry-run:
    name: Run Ansible Dry-Run
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-apt git ca-certificates sudo

      - name: Install Ansible and Python deps
        run: |
          python3 -m pip install --break-system-packages ansible-core docker

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook in check mode (dry-run tag)
        run: |
          ansible-playbook ansible/Install.yml \
            --inventory "localhost," \
            --connection local \
            --tags "dry_run" \
            --check \
            --diff
