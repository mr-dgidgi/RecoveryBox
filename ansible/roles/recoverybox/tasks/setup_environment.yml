---
- name: Install packages
  ansible.builtin.apt:
    pkg:
      - curl
      - gpg
      - ca-certificates
      - git
      - wget
      - firmware-realtek
      - firmware-iwlwifi
      - intel-microcode
      - rfkill
      - iw
      - tcpdump
      - gpsd
      - gpsd-clients
      - chrony
      - wpasupplicant
      - htop
      - jq
      - net-tools
      - unzip
      - tippecanoe
      - rsync
      - python3-pip
      - python3-venv
      - libapache2-mod-wsgi-py3
      - openssl
      - cockpit
      - fping
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Create recoverybox folder
  ansible.builtin.file:
    path: /etc/recoverybox
    state: directory
    mode: '0755'

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Generate Certificate for HTTPS
  block:
    - name: Create SSL directory
      ansible.builtin.file:
        path: /etc/ssl/recoverybox
        state: directory
        mode: '0755'

    - name: Create private key
      community.crypto.openssl_privatekey:
        path: /etc/ssl/recoverybox/recoverybox.key
        state: present

    - name: Create CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: /etc/ssl/recoverybox/recoverybox.key
        common_name: "recovery.box"
        organization_name: "RecoveryBox Project"
        subject_alt_name:
          - DNS:recovery.box
          - DNS:www.recovery.box
      register: recoverybox_csr

    - name: Create self-signed certificate
      community.crypto.x509_certificate:
        path: /etc/ssl/recoverybox/recoverybox.crt
        csr_content: "{{ recoverybox_csr.csr }}"
        privatekey_path: /etc/ssl/recoverybox/recoverybox.key
        provider: selfsigned
        state: present

    - name: Get users list
      ansible.builtin.getent:
        database: passwd
      register: recoverybox_users_list

    - name: Get groups list
      ansible.builtin.getent:
        database: group
      register: recoverybox_groups_list

    - name: Set user and group 1000
      ansible.builtin.set_fact:
        recoverybox_user_1000: "{{ recoverybox_users_list | dict2items | selectattr('value', 'search', '1000') | map(attribute='key') }}"
        recoverybox_group_1000: "{{ recoverybox_groups_list | dict2items | selectattr('value', 'search', '1000') | map(attribute='key') }}"
