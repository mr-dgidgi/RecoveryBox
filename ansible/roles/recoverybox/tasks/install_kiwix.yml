---
- name: Install Kiwix
  when:
    - recoverybox_enable_kiwix
    - recoverybox_enable_apache
  block:
    - name: Create Kiwix directory
      ansible.builtin.file:
        path: /data/kiwix
        state: directory
        mode: '0755'

    - name: Download Kiwix container
      community.docker.docker_image:
        name: ghcr.io/kiwix/kiwix-serve
        tag: "{{ recoverybox_version_kiwix }}"
        source: pull

    - name: Create Kiwix service
      ansible.builtin.template:
        src: etc/systemd/system/kiwix.service.j2
        dest: /etc/systemd/system/kiwix.service
        owner: root
        group: root
        mode: '0644'

    - name: Create kiwix apache2 site
      ansible.builtin.copy:
        src: etc/apache2/sites-available/kiwix.conf
        dest: /etc/apache2/sites-available/kiwix.conf
        owner: root
        group: root
        mode: '0644'

    - name: Enable kiwix site
      ansible.builtin.command:
        cmd: a2ensite kiwix.conf
      changed_when: false

    - name: Reload apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        state: reloaded
      when: "'dry_run' not in ansible_run_tags"

    - name: Enable Kiwix service
      ansible.builtin.systemd_service:
        name: kiwix
        enabled: "{{ recoverybox_enable_kiwix }}"
        daemon_reload: true
      when: "'dry_run' not in ansible_run_tags"

- name: Deactivate Kiwix
  when: not recoverybox_enable_kiwix or not recoverybox_enable_apache
  block:
    - name: Check if kiwix.conf file exists
      ansible.builtin.stat:
        path: /etc/apache2/sites-available/kiwix.conf
      register: recoverybox_apache_file

    - name: Disable kiwix site
      ansible.builtin.command:
        cmd: a2dissite kiwix.conf
      changed_when: false
      when: recoverybox_apache_file.stat.exists

    - name: Disable kiwix service
      ansible.builtin.systemd_service:
        name: kiwix
        enabled: "{{ recoverybox_enable_kiwix }}"
        state: stopped
      when:
        - "'dry_run' not in ansible_run_tags"
        - "'kiwix.service' in ansible_facts.services"
