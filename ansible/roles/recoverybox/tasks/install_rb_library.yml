---
- name: Install RecoveryBox Library
  when:
    - recoverybox_enable_library
    - recoverybox_enable_apache
  block:
    - name: Create /data/library directory
      ansible.builtin.file:
        path: /data/library
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Clone library repository
      ansible.builtin.git:
        repo: "https://github.com/mr-dgidgi/rb-library.git"
        dest: /data/library
        version: "129-web-indexation"
        force: true

    - name: Create /data/library/PDF/custom directory
      ansible.builtin.file:
        path: /data/library/PDF/custom
        state: directory
        owner: "{{ recoverybox_user_1000 }}"
        group: "{{ recoverybox_group_1000 }}"
        mode: '0755'
      when: "'dry_run' not in ansible_run_tags"

    - name: Create /data/library/PDF/custom/custom-library.json file
      ansible.builtin.file:
        path: /data/library/PDF/custom/custom-library.json
        state: touch
        owner: "{{ recoverybox_user_1000 }}"
        group: "{{ recoverybox_group_1000 }}"
        mode: '0644'
      when: "'dry_run' not in ansible_run_tags"

    - name: Install python package in virtual environment
      ansible.builtin.pip:
        requirements: /data/library/backend/requirements.txt
        virtualenv: "{{ recoverybox_virtualenv_dir }}"
        virtualenv_command: python3 -m venv
        state: present

    - name: Generate library secret key
      ansible.builtin.set_fact:
        recoverybox_library_key: "{{ lookup('community.general.random_string', length=32) }}"

    - name: Copy admin-config.json
      ansible.builtin.template:
        src: data/library/backend/admin-config.json.j2
        dest: /data/library/backend/admin-config.json
        owner: root
        group: root
        mode: '0644'

    - name: Copy apache-vhost-snippet.conf
      ansible.builtin.template:
        src: data/library/backend/apache-vhost-snippet.conf.j2
        dest: /data/library/backend/apache-vhost-snippet.conf
        owner: root
        group: root
        mode: '0644'

    - name: Create library apache2 site
      ansible.builtin.template:
        src: etc/apache2/sites-available/library.conf.j2
        dest: /etc/apache2/sites-available/library.conf
        owner: root
        group: root
        mode: '0644'

    - name: Enable library site
      ansible.builtin.command:
        cmd: a2ensite library.conf
      changed_when: false

    - name: Reload apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        state: reloaded
      when: "'dry_run' not in ansible_run_tags"

- name: Deactivate RecoveryBox Library
  when: not recoverybox_enable_library or not recoverybox_enable_apache
  block:
    - name: Check if library.conf file exists
      ansible.builtin.stat:
        path: /etc/apache2/sites-available/library.conf
      register: recoverybox_apache_file

    - name: Disable library site
      ansible.builtin.command:
        cmd: a2dissite library.conf
      changed_when: false
      when: recoverybox_apache_file.stat.exists
