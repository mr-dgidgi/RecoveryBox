---
- name: Install Apache2
  when: recoverybox_enable_apache
  block:
    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Enable Apache2 modules
      ansible.builtin.command:
        cmd: "a2enmod {{ item }}"
      changed_when: false
      loop:
        - proxy
        - proxy_http
        - proxy_wstunnel
        - rewrite
        - ssl

    - name: Create /data/www directory
      ansible.builtin.file:
        path: /data/www
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy all web content to /data/www (Optimized with rsync)
      ansible.posix.synchronize:
        src: data/www/
        dest: /data/www/
        delete: true
        rsync_opts:
          - "--chmod=F644,D755"
          - "--chown=root:root"

    - name: Create recovery.box site
      ansible.builtin.template:
        src: etc/apache2/sites-available/000-www.conf.j2
        dest: /etc/apache2/sites-available/000-www.conf
        owner: root
        group: root
        mode: '0644'

    - name: Enable recovery.box site
      ansible.builtin.command:
        cmd: a2ensite 000-www.conf
      changed_when: false

    - name: Disable default site
      ansible.builtin.command:
        cmd: a2dissite 000-default.conf
      changed_when: false

    - name: Enable apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        enabled: "{{ recoverybox_enable_apache }}"
        state: started
      when: "'dry_run' not in ansible_run_tags"

- name: Deactivate Apache2
  when: not recoverybox_enable_apache
  block:
    - name: Check if 000-www.conf file exists
      ansible.builtin.stat:
        path: /etc/apache2/sites-available/000-www.conf
      register: recoverybox_apache_file

    - name: Disable recovery.box site
      ansible.builtin.command:
        cmd: a2dissite 000-www.conf
      changed_when: false
      when: recoverybox_apache_file.stat.exists

    - name: Disable apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        enabled: "{{ recoverybox_enable_apache }}"
      when:
        - "'dry_run' not in ansible_run_tags"
        - "'apache2.service' in ansible_facts.services"
