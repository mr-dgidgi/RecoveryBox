---
- name: Install dependencies for RTL-SDR drivers compilation
  ansible.builtin.package:
    name:
      - libusb-1.0-0-dev
      - git
      - cmake
      - debhelper
      - build-essential
      - pkg-config
    state: present

- name: Clone rtl-sdr-blog repository
  ansible.builtin.git:
    repo: 'https://github.com/rtlsdrblog/rtl-sdr-blog'
    dest: "/tmp/rtl-sdr-blog"
    version: "{{ recoverybox_version_rtlsdr }}"
    force: true

- name: Compile and package into .deb files # noqa no-changed-when
  ansible.builtin.command:
    cmd: dpkg-buildpackage -b --no-sign
    chdir: "/tmp/rtl-sdr-blog"

- name: Collect generated .deb packages
  ansible.builtin.set_fact:
    recoverybox_rtlsdr_deb_packages: >-
      {{
        query('fileglob', '/tmp/librtlsdr0_*.deb')
        + query('fileglob', '/tmp/librtlsdr-dev_*.deb')
        + query('fileglob', '/tmp/rtl-sdr_*.deb')
      }}

- name: Ensure generated .deb packages were found
  ansible.builtin.assert:
    that:
      - recoverybox_rtlsdr_deb_packages | length > 0
    fail_msg: "No RTL-SDR .deb packages were found in /tmp after build."

- name: Install the generated .deb packages
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop: "{{ recoverybox_rtlsdr_deb_packages }}"

- name: Blacklist the DVB-T TV driver
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/blacklist-rtl.conf
    line: "blacklist dvb_usb_rtl2832u"
    create: true
    mode: '0644'

- name: Clean up build files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      ['/tmp/rtl-sdr-blog']
      + query('fileglob', '/tmp/librtlsdr0_*.deb')
      + query('fileglob', '/tmp/librtlsdr-dev_*.deb')
      + query('fileglob', '/tmp/rtl-sdr_*.deb')
      + query('fileglob', '/tmp/librtlsdr0-dbgsym_*.deb')
      + query('fileglob', '/tmp/rtl-sdr-dbgsym_*.deb')
      + query('fileglob', '/tmp/rtl-sdr_*.buildinfo')
      + query('fileglob', '/tmp/rtl-sdr_*.changes')
    }}
