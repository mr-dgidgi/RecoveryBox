---
- name: Install dependencies for RTL-SDR drivers compilation
  ansible.builtin.package:
    name:
      - libusb-1.0-0-dev
      - git
      - cmake
      - debhelper
      - build-essential
      - pkg-config
    state: present

- name: Clone rtl-sdr-blog repository
  ansible.builtin.git:
    repo: 'https://github.com/rtlsdrblog/rtl-sdr-blog'
    dest: "/tmp/rtl-sdr-blog"
    version: "{{ recoverybox_version_rtlsdr }}"
    force: true

- name: Compile and package into .deb files # noqa no-changed-when
  ansible.builtin.command:
    cmd: dpkg-buildpackage -b --no-sign
    chdir: "/tmp/rtl-sdr-blog"

- name: Install the generated .deb packages
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop:
    - "/tmp/librtlsdr0_*.deb"
    - "/tmp/librtlsdr-dev_*.deb"
    - "/tmp/rtl-sdr_*.deb"

- name: Blacklist the DVB-T TV driver
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/blacklist-rtl.conf
    line: "blacklist dvb_usb_rtl2832u"
    create: true
    mode: '0644'

- name: Clean up build files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/rtl-sdr-blog"
    - "/tmp/librtlsdr0_*.deb"
    - "/tmp/librtlsdr-dev_*.deb"
    - "/tmp/rtl-sdr_*.deb"
