<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <title>RecoveryBox - Services</title>
  <link rel="stylesheet" href="./fonts.googleapis.com/css.49ea35f2.css">
  <link rel="stylesheet" href="./recoverybox-theme.css">
</head>
<body class="rb-app">
  <div id="rb-clock" class="rb-clock" aria-live="polite"></div>
  <main class="rb-container">

      <input class="md-option" data-md-color-media="(prefers-color-scheme: light)" data-md-color-scheme="default" aria-label="Passage en mode nuit" type="radio" name="__palette" id="__palette_0">

      <input class="md-option" data-md-color-media="(prefers-color-scheme: dark)" data-md-color-scheme="slate" aria-label="Passage en mode jour" type="radio" name="__palette" id="__palette_1">
      <label id="theme-to-light" class="md-header__button md-icon" title="Passage en mode jour" for="__palette_0" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m17.75 4.09-2.53 1.94.91 3.06-2.63-1.81-2.63 1.81.91-3.06-2.53-1.94L12.44 4l1.06-3 1.06 3zm3.5 6.91-1.64 1.25.59 1.98-1.7-1.17-1.7 1.17.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95zm-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14.4-.4.82-.76 1.27-1.08.75-.53 1.93.36 1.85 1.19-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82-2.81 3.14-2.7 7.96.31 10.98 3.02 3.01 7.84 3.12 10.98.31"/></svg>
      </label>
    </form>


    <h1>RecoveryBox</h1>

    <section class="rb-card">
      <h2>Services</h2>
      <div id="services-list" class="rb-service-grid"></div>
    </section>

    <section class="rb-card">
      <h2>Status</h2>
      <div id="status-content"></div>
    </section>

    <section class="rb-card">
      <h2>GPS</h2>
      <div id="gps-content"></div>
    </section>

    <section class="rb-card">
      <h2>Système</h2>
      <div id="system-content"></div>
    </section>

    <section class="rb-card">
      <h2>Battery</h2>
      <div id="battery-content"></div>
    </section>

    <footer class="rb-card">
      <p>Si un service ne répond pas, vérifiez qu'il est démarré et que vous êtes connecté au réseau RecoveryBox. / If a service does not respond, check it is started and that you are connected to the RecoveryBox network.</p>
    </footer>
  </main>
  <script>
  (function() {
    const storageKey = 'rb-theme';
    const root = document.documentElement;
    const clock = document.getElementById('rb-clock');
    const lightInput = document.getElementById('__palette_0');
    const darkInput = document.getElementById('__palette_1');
    const toDark = document.getElementById('theme-to-dark');
    const toLight = document.getElementById('theme-to-light');
    const clockFormatter = new Intl.DateTimeFormat('fr-FR', {
      dateStyle: 'short',
      timeStyle: 'medium'
    });

    function getSavedTheme() {
      try {
        return localStorage.getItem(storageKey);
      } catch (err) {
        return null;
      }
    }

    function setSavedTheme(theme) {
      try {
        localStorage.setItem(storageKey, theme);
      } catch (err) {
        // Ignore storage errors (private mode or strict file:// policy)
      }
    }

    function getPreferredTheme() {
      const saved = getSavedTheme();
      if (saved === 'dark' || saved === 'light') {
        return saved;
      }
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        darkInput.checked = true;
        toLight.hidden = false;
        toDark.hidden = true;
      } else {
        lightInput.checked = true;
        toDark.hidden = false;
        toLight.hidden = true;
      }
    }

    applyTheme(getPreferredTheme());

    function updateClock() {
      if (clock) {
        clock.textContent = clockFormatter.format(new Date());
      }
    }

    updateClock();
    window.setInterval(updateClock, 1000);

    toDark.addEventListener('click', function(event) {
      event.preventDefault();
      setSavedTheme('dark');
      applyTheme('dark');
    });

    toLight.addEventListener('click', function(event) {
      event.preventDefault();
      setSavedTheme('light');
      applyTheme('light');
    });
  })();

  fetch('/rbstatus.json')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('services-list');
      data.services
        .filter(s => s.status === 0 && s.url)
        .forEach(s => {
          const a = document.createElement('a');
          a.href = s.url;
          a.className = 'rb-service-tile';
          const header = document.createElement('div');
          header.className = 'rb-service-tile-header';
          const title = document.createElement('span');
          title.className = 'rb-service-tile-title';
          title.textContent = s.name;
          header.appendChild(title);
          a.appendChild(header);
          if (s.logo) {
            const logo = document.createElement('span');
            logo.className = 'rb-service-tile-logo';
            logo.innerHTML = s.logo;
            header.appendChild(logo);
          }
          const label = document.createElement('span');
          list.appendChild(a);
        });

      const statusDiv = document.getElementById('status-content');
      data.services.forEach(s => {
        const dotClass = s.status === 0 ? 'online' : 'offline';
        const statusLabel = s.status === 0 ? 'running'
                    : s.status === 1 ? 'critical'
                    : 'disabled';
        statusDiv.innerHTML += '<div class="rb-status-row"><span>' + s.name + '</span><span class="rb-badge"><span class="rb-status-dot ' + dotClass + '"></span>' + statusLabel + '</span></div>';
      });

      const gpsDiv = document.getElementById('gps-content');
      const g = data.gps;
      const gpsDot = g.status === 0 ? 'online' : 'offline';
      const gpsLabel = g.status === 0 ? 'running' : 'critical';
      let gpsHtml = '<div class="rb-status-row"><span>GPS</span><span class="rb-badge"><span class="rb-status-dot ' + gpsDot + '"></span>' + g.fix + '</span></div>';
      if (g.lat && g.lon) {
        let posText = 'Lat: ' + g.lat + ', Lon: ' + g.lon;
        if (g.alt) posText += ', Alt: ' + g.alt + 'm';
        gpsHtml += '<div class="rb-status-row"><span>Position</span><span class="rb-data">' + posText + '</span></div>';
      }
      gpsDiv.innerHTML = gpsHtml;

      const sysDiv = document.getElementById('system-content');
      const sys = data.system;
      const sysItems = [
        { label: 'CPU', value: sys.cpu + '%', threshold: sys.cpu },
        { label: 'RAM', value: sys.ram + '%', threshold: sys.ram },
        { label: 'Swap', value: sys.swap + '%', threshold: sys.swap }
      ];
      sys.temp.forEach(function(t, i) {
        sysItems.push({ label: 'Temp ' + (i + 1), value: t + '°C', threshold: t });
      });
      sysDiv.innerHTML = sysItems.map(function(item) {
        const dotClass = item.threshold > 80 ? 'offline'
                    : item.threshold > 60 ? 'warning'
                    : 'online';
        return '<div class="rb-status-row"><span>' + item.label + '</span><span class="rb-badge rb-data"><span class="rb-status-dot ' + dotClass + '"></span>' + item.value + '</span></div>';
      }).join('');
    });

  fetch('/vedirect.json')
    .then(res => res.json())
    .then(data => {
      const battDiv = document.getElementById('battery-content');
      const values = {};
      (data.Values || []).forEach(function(v) {
        values[v.id] = v;
      });

      const battItems = [];

      function addRow(label, value, dotClass) {
        battItems.push({ label: label, value: value, dotClass: dotClass });
      }

      function voltageStatus(mv) {
        return mv < 12000 ? 'offline' : mv < 12400 ? 'warning' : 'online';
      }

      if (values.V) {
        addRow('Battery Voltage', (values.V.value / 1000).toFixed(2) + ' V', voltageStatus(values.V.value));
      }
      if (values.I) {
        addRow('Battery Current', (values.I.value / 1000).toFixed(2) + ' A', 'online');
      }
      if (values.VPV) {
        addRow('Input Voltage', (values.VPV.value / 1000).toFixed(2) + ' V', 'online');
      }
      if (values.PPV) {
        addRow('Input Power', values.PPV.value + ' W', 'online');
      }
      if (values.CS) {
        const csLabels = { 0: 'Off', 2: 'Fault', 3: 'Bulk', 4: 'Absorption', 5: 'Float' };
        const csValue = csLabels[values.CS.value] !== undefined ? csLabels[values.CS.value] : values.CS.value;
        addRow('Charge State', csValue, 'online');
      }
      if (values.ERR) {
        addRow('Error Code', values.ERR.value, values.ERR.value === 0 ? 'online' : 'offline');
      }
      if (values.LOAD) {
        addRow('Load Output', values.LOAD.value, values.LOAD.value === 'ON' ? 'online' : 'warning');
      }
      if (values.IL) {
        addRow('Load Output Current', (values.IL.value / 1000).toFixed(2) + ' A', 'online');
      }
      if (values.H21) {
        addRow('Maximum Input Power Today', values.H21.value + ' W', 'online');
      }

      if (data.ErrorMessage) {
        addRow('Error', data.ErrorMessage, 'offline');
      }

      if (battItems.length === 0) {
        battDiv.innerHTML = '<div class="rb-status-row"><span>Battery</span><span class="rb-badge rb-data"><span class="rb-status-dot offline"></span>No data</span></div>';
      } else {
        battDiv.innerHTML = battItems.map(function(item) {
          return '<div class="rb-status-row"><span>' + item.label + '</span><span class="rb-badge rb-data"><span class="rb-status-dot ' + item.dotClass + '"></span>' + item.value + '</span></div>';
        }).join('');
      }
    })
    .catch(function() {
      const battDiv = document.getElementById('battery-content');
      if (battDiv) {
        battDiv.innerHTML = '<div class="rb-status-row"><span>Battery</span><span class="rb-badge rb-data"><span class="rb-status-dot offline"></span>Data unavailable</span></div>';
      }
    });
  </script>
</body>
</html>
