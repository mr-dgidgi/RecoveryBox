<VirtualHost *:80>
    ServerName wiki.recovery.box

    ProxyPass        / http://127.0.0.1:18001/
    ProxyPassReverse / http://127.0.0.1:18001/

    <Location />
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/wiki_error.log
    CustomLog ${APACHE_LOG_DIR}/wiki_access.log combined
</VirtualHost>